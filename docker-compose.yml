# DigitalOcean droplet deploy: docker compose up -d --build  (see docs/12-hosting-and-deploy.md)
services:
  app:
    build: .
    env_file: .env
    environment:
      APP_MODE: historical
      DEMO_PERSONA: priya
      SNAPSHOT_DIR: /data/snapshot
      STATE_DB: /data/state.sqlite
      RUNS_DIR: /data/runs
    volumes:
      - ./var:/data
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
