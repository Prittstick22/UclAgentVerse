  lambda_track: 5.0
  lambda_turn: 1.0
  lambda_fee: 1.0
  lookback: 504
  min_lookback: 252
risk:
  stale_after_days: 3
periods:
  development: ["2025-11-07", "2026-03-31"]
  held_out: ["2026-04-01", null]
benchmark_global_etf: "VWRP.LSE"
