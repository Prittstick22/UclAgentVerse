# Frozen simulation parameters. Change only via a board post BEFORE the eval-freeze tag.
sim:
  start: "2026-07-07"          # 4-month window, entirely after Argon's reported Mar 2026 cutoff
  end: null                    # null = last date in the snapshot
  capital_gbp: 10000
  monthly_contribution_gbp: 200
review_every_n_days: 10        # 10 = fortnightly, 5 = weekly
triggers:
  drift_pp: 0.05               # asset class or holding this far from target (percentage points)
  price_move_day: 0.05
  price_move_since_review: 0.10
  nav_drop: 0.05               # vs NAV at last review
  news_relevance: 0.7
  corr_jump: 0.15              # informs review only
cooldown_days: 5
fold_into_review_days: 2
min_trade_gbp: 25
costs:
  trade: 0.0010                # labelled assumption
  fx: 0.0015                   # extra on USD instruments
batch_auto_approve_turnover_max: 0.10
optimiser:
  lambda_track: 5.0
  lambda_turn: 1.0
  lambda_fee: 1.0
  lookback: 504
  min_lookback: 252
risk:
  stale_after_days: 3
forecast:                      # walk-forward 2-week outlook (engine/forecast.py, #73)
  horizon_days: 10
  ewma_halflife_days: 10
  shrink: 0.5                  # shrink mu towards 0
  lambda_return: 0.1           # 0 = no-forecast ablation. Mu enters the optimiser scaled to the horizon (x10/252).
                               # Chosen on development data only: python -m app.engine.forecast --calibrate
                               # Calibrated on the REAL EODHD snapshot (Sun 8 Nov ~01:45): 65 reviews 2023-12-26 -> 2026-06-23,
                               # median forecast-only turnover at 0.1 = 4.0/5.3/5.4/5.2% (cautious/balanced/growth/adventurous);
                               # 0.2 fails the 10% rule (balanced 10.5%). The synthetic snapshot had given 0.05.
  max_tilt_per_holding: 0.03   # forecast may move any one holding at most 3 pp from the no-forecast portfolio
  max_tilt_total: 0.10         # ... and at most 10% of the portfolio in total (one-way)
  max_view_tilt: 0.02          # cap on agent-view tilt to annualised mu (#74)
periods:
  development: ["2023-01-02", "2026-07-06"]   # pre-sim data: parameter sanity checks only
  held_out: ["2026-07-07", null]              # the whole sim window
benchmark_global_etf: "VWRP.LSE"
