# Frozen simulation parameters. Change only via a board post BEFORE the eval-freeze tag.
sim:
  start: "2025-11-07"
  end: null                    # null = last date in the snapshot
  capital_gbp: 10000
  monthly_contribution_gbp: 200
review_every_n_days: 10        # 10 = fortnightly, 5 = weekly
triggers:
  drift_pp: 0.05               # asset class or holding this far from target (percentage points)
  price_move_day: 0.05
  price_move_since_review: 0.10
