# Supervisor limits, enforced in code (backend/app/agents/supervisor.py). See docs/05-agent-system.md §3.
max_depth: 2
max_agents_per_run:
  construction: 12
  review: 4
  rebalance: 4
  trigger: 8
  chat: 3
  retrospective: 3
  manual: 8
max_parallel: 5                  # 3 queued the 4 construction specialists (#30 live check: 252s -> see board)
max_children_per_agent: 2        # non-lead agents
max_children_lead: 6
max_tool_calls_per_agent: 8
max_steps_per_agent: 6
max_revision_loops: 1
run_token_budget:
  construction: 400000
  review: 60000
  rebalance: 40000
  trigger: 200000
  chat: 80000
  retrospective: 120000
  manual: 200000
run_wall_time_s: 300
schema_retry: 1
# USD per 1M tokens (Gemini API Standard tier, AI Studio pricing page, checked Sat 7 Nov 2026).
# Output includes thinking tokens. Argon's price doubles on 1 Dec 2026; hackathon credits are free but finite.
pricing:
  gemini-4-argon: {input_per_m: 2.00, output_per_m: 10.00}
  gemini-3.8-flash: {input_per_m: 0.75, output_per_m: 3.75}
