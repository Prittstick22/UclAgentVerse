[project]
name = "uclagentverse"
version = "0.1.0"
description = "AI investment team for first-time UK investors (UCL AgentVerse 2026)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "cvxpy>=1.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.yaml", "config/*.json", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
